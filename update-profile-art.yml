name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar (no token needed)
        run: python scripts/fetch_contributions.py Dev-Harshupadhyay > contributions.json

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py < contributions.json > harsh-heatmap.svg

      - name: Fetch stats (uses the built-in Actions token, never committed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py Dev-Harshupadhyay > stats.json

      - name: Render stats + languages + trophies
        run: |
          python scripts/render_stats_svg.py < stats.json > harsh-stats.svg
          python scripts/render_languages_svg.py < stats.json > harsh-languages.svg
          python scripts/render_trophies_svg.py < stats.json > harsh-trophies.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add harsh-heatmap.svg harsh-stats.svg harsh-languages.svg harsh-trophies.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile art"
          git push
