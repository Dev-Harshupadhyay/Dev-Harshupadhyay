<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay — Developer, building for the web and for Chhath">
  <title>Harsh Upadhyay — Developer</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a0b0a"/>
      <stop offset="0.45" stop-color="#3d1110"/>
      <stop offset="1" stop-color="#0e1330"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#f0a544" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0a544" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#f0a544"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#080c1c"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#f7c377"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a0b0a" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#2a0b0a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2a0b0a" stop-opacity="0"/>
    </linearGradient>

    <pattern id="madhubani" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8ce8f" stroke-opacity="0.10" stroke-width="1">
        <circle cx="24" cy="24" r="7"/>
        <path d="M24 12c3 4 3 20 0 24M24 12c-3 4-3 20 0 24M12 24c4-3 20-3 24 0M12 24c4 3 20 3 24 0"/>
      </g>
      <g fill="#e8ce8f" fill-opacity="0.12">
        <circle cx="0" cy="0" r="1.4"/><circle cx="48" cy="0" r="1.4"/>
        <circle cx="0" cy="48" r="1.4"/><circle cx="48" cy="48" r="1.4"/>
      </g>
    </pattern>

    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>

    <style>
      .f { font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      @keyframes breathe { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:.85; transform:scale(1.06); } }
      @keyframes flicker { 0%,100% { opacity:.75; transform:translateY(0); } 50% { opacity:1; transform:translateY(-2.5px); } }
      @keyframes drift  { 0% { transform:translateX(0);} 50% { transform:translateX(5px);} 100% { transform:translateX(0);} }
      @keyframes shimmer { 0% { background-position:0 0; } 100% { background-position:200% 0; } }
      .glow   { animation: breathe 6s ease-in-out infinite; transform-origin:940px 168px; }
      .diya   { animation: flicker 3.4s ease-in-out infinite; }
      .diya2  { animation: flicker 4.2s ease-in-out infinite; animation-delay:.7s; }
      .diya3  { animation: flicker 2.9s ease-in-out infinite; animation-delay:1.4s; }
      .drift  { animation: drift 9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .glow,.diya,.diya2,.diya3,.drift { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base sky -->
    <rect width="1200" height="320" fill="url(#sky)"/>
    <rect width="1200" height="320" fill="url(#madhubani)"/>

    <!-- sun + glow -->
    <g>
      <ellipse class="glow" cx="940" cy="168" rx="185" ry="150" fill="url(#sunGlow)"/>
      <circle cx="940" cy="168" r="46" fill="url(#sunBody)"/>
      <g stroke="#ffe9b8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
        <path d="M940 104V92"/><path d="M940 244v-12"/>
        <path d="M876 168h-12"/><path d="M1016 168h12"/>
        <path d="M895 123l-9-9"/><path d="M985 213l9 9"/>
        <path d="M985 123l9-9"/><path d="M895 213l-9 9"/>
      </g>
    </g>

    <!-- river -->
    <path d="M0 250h1200v70H0z" fill="url(#water)"/>
    <g class="drift" stroke="#ffce7a" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round">
      <path d="M820 268h52"/><path d="M900 282h74"/><path d="M1010 266h60"/>
      <path d="M860 296h46"/><path d="M960 304h58"/>
    </g>

    <!-- devotee silhouettes at the ghat -->
    <g fill="#0b0710" fill-opacity="0.9">
      <g transform="translate(872 250)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-13 -30l7-16M13 -30l-7-16"/>
      </g>
      <g transform="translate(1006 250) scale(1.08)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-13 -32l8-14M13 -32l-8-14"/>
      </g>
      <g transform="translate(1092 250) scale(0.9)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-12 -28l6-18M12 -28l-6-18"/>
      </g>
    </g>

    <!-- floating diyas -->
    <g>
      <g class="diya" transform="translate(790 286)">
        <path d="M0 0c-9 0-15-5-15-9h30c0 4-6 9-15 9z" fill="#f4a52a"/>
        <ellipse cx="0" cy="-12" rx="4.5" ry="7" fill="#ffe6b0"/>
        <ellipse cx="0" cy="-12" rx="11" ry="16" fill="#f4a52a" fill-opacity="0.22"/>
      </g>
      <g class="diya2" transform="translate(1096 292)">
        <path d="M0 0c-8 0-13-4.5-13-8h26c0 3.5-5 8-13 8z" fill="#f4a52a"/>
        <ellipse cx="0" cy="-11" rx="4" ry="6" fill="#ffe6b0"/>
        <ellipse cx="0" cy="-11" rx="10" ry="14" fill="#f4a52a" fill-opacity="0.22"/>
      </g>
      <g class="diya3" transform="translate(700 296)">
        <path d="M0 0c-7 0-12-4-12-7.5h24c0 3.5-5 7.5-12 7.5z" fill="#f4a52a"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="5.5" fill="#ffe6b0"/>
        <ellipse cx="0" cy="-10" rx="9" ry="12" fill="#f4a52a" fill-opacity="0.22"/>
      </g>
    </g>

    <!-- left fade so text stays readable -->
    <rect width="1200" height="320" fill="url(#fade)"/>

    <!-- ===== text ===== -->
    <g class="f">
      <text x="64" y="86" fill="#d9b45b" font-size="15" font-weight="700" letter-spacing="5.5">HELLO, I&apos;M</text>

      <text x="64" y="150" fill="url(#textGrad)" font-size="60" font-weight="800" letter-spacing="-0.5">Harsh Upadhyay</text>

      <text x="64" y="188" fill="#f7eddd" font-size="21" font-weight="600">BCA student &amp; web developer</text>
      <text x="64" y="216" fill="#efe2cb" font-size="17" font-weight="400" opacity="0.82">Building things for the web — and for Chhath.</text>

      <!-- chips -->
      <g>
        <rect x="64" y="240" width="118" height="30" rx="15" fill="#f0a544" fill-opacity="0.14" stroke="#f0a544" stroke-opacity="0.55"/>
        <text x="123" y="260" fill="#f7c377" font-size="13" font-weight="700" text-anchor="middle">React</text>

        <rect x="192" y="240" width="96" height="30" rx="15" fill="#f0a544" fill-opacity="0.14" stroke="#f0a544" stroke-opacity="0.55"/>
        <text x="240" y="260" fill="#f7c377" font-size="13" font-weight="700" text-anchor="middle">Vite</text>

        <rect x="298" y="240" width="118" height="30" rx="15" fill="#f0a544" fill-opacity="0.14" stroke="#f0a544" stroke-opacity="0.55"/>
        <text x="357" y="260" fill="#f7c377" font-size="13" font-weight="700" text-anchor="middle">JavaScript</text>

        <rect x="426" y="240" width="104" height="30" rx="15" fill="#f0a544" fill-opacity="0.14" stroke="#f0a544" stroke-opacity="0.55"/>
        <text x="478" y="260" fill="#f7c377" font-size="13" font-weight="700" text-anchor="middle">Python</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#e8ce8f" stroke-opacity="0.18"/>
</svg>
