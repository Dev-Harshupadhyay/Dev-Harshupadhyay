<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay — BCA Student, Developer, AI and Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="55%" stop-color="#0c0f16"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8fe8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4f8fe8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141922" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#0d1017" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="titleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fb2ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6fb2ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- distant window light beam -->
    <polygon points="740,0 1040,0 1200,320 900,320" fill="url(#beam)"/>
    <polygon points="1000,0 1080,0 1200,180 1200,320 1140,320" fill="#4f8fe8" opacity="0.05"/>

    <!-- faint grid / classroom window mullions -->
    <g stroke="#1c2330" stroke-width="1" opacity="0.5">
      <line x1="820" y1="0" x2="820" y2="320"/>
      <line x1="920" y1="0" x2="920" y2="320"/>
      <line x1="1020" y1="0" x2="1020" y2="320"/>
      <line x1="1120" y1="0" x2="1120" y2="320"/>
      <line x1="760" y1="70" x2="1200" y2="70"/>
      <line x1="760" y1="150" x2="1200" y2="150"/>
    </g>

    <!-- desks (simple classroom silhouette, lower right) -->
    <g fill="#11151d" stroke="#1e2632" stroke-width="1">
      <rect x="860" y="230" width="120" height="8" rx="2"/>
      <rect x="885" y="238" width="6" height="34"/>
      <rect x="945" y="238" width="6" height="34"/>
      <rect x="990" y="248" width="120" height="8" rx="2"/>
      <rect x="1015" y="256" width="6" height="34"/>
      <rect x="1075" y="256" width="6" height="34"/>
    </g>

    <!-- floor shadow -->
    <rect x="0" y="230" width="1200" height="90" fill="url(#floor)"/>

    <!-- ambient particles -->
    <g fill="#8fc2ff">
      <circle cx="120" cy="60" r="1.6" opacity="0.5">
        <animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="200" r="1.2" opacity="0.4">
        <animate attributeName="cy" values="200;180;200" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="40" r="1.4" opacity="0.45">
        <animate attributeName="cy" values="40;60;40" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.55;0.2" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="100" r="1.8" opacity="0.5">
        <animate attributeName="cy" values="100;120;100" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="60" r="1.3" opacity="0.4">
        <animate attributeName="cy" values="60;80;60" dur="7.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.5;0.15" dur="7.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- student silhouette, calm / strategic pose, right of center -->
    <g transform="translate(905,60)">
      <ellipse cx="70" cy="230" rx="70" ry="12" fill="#000" opacity="0.35" filter="url(#soft)"/>
      <!-- rim light -->
      <path d="M8 230 C 4 150, 10 90, 40 55 C 55 38, 78 30, 96 34 C 118 39, 130 60, 128 90 L 124 230 Z" fill="url(#rim)" opacity="0.5"/>
      <!-- body silhouette -->
      <path d="M6 230 C 2 148, 8 88, 38 54 C 54 36, 80 27, 100 32 C 124 38, 137 62, 133 92 L 128 230 Z" fill="#0c0f15"/>
      <!-- collar / blazer accent -->
      <path d="M46 60 L 70 96 L 94 60" fill="none" stroke="#243044" stroke-width="2" opacity="0.8"/>
      <!-- head -->
      <circle cx="70" cy="34" r="26" fill="#0c0f15"/>
      <path d="M46 24 C 50 6 92 6 96 26 C 90 18 78 14 70 14 C 60 14 50 18 46 24 Z" fill="#080a0e"/>
      <!-- calm gaze highlight -->
      <circle cx="79" cy="34" r="1.4" fill="#8fc2ff" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- scanline -->
    <rect x="0" y="0" width="1200" height="2" fill="#5b9dff" opacity="0.06">
      <animate attributeName="y" values="0;320;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- title glow -->
    <ellipse cx="360" cy="130" rx="360" ry="140" fill="url(#titleGlow)" filter="url(#soft2)"/>

    <!-- text block -->
    <text x="70" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="2" fill="#eef2f7">HARSH UPADHYAY</text>
    <text x="72" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#7c8aa0">BCA STUDENT • DEVELOPER • AI &amp; AUTOMATION</text>

    <!-- terminal strip -->
    <g transform="translate(70,196)">
      <rect x="-14" y="-22" width="470" height="70" rx="10" fill="#0d1119" stroke="#1c2431" stroke-width="1"/>
      <circle cx="2" cy="-6" r="4" fill="#3a4657"/>
      <circle cx="18" cy="-6" r="4" fill="#3a4657"/>
      <circle cx="34" cy="-6" r="4" fill="#3a4657"/>
      <text x="0" y="18" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="15" fill="#8fc2ff">harsh@github <tspan fill="#586479">~ $</tspan> whoami</text>
      <rect x="228" y="6" width="8" height="16" fill="#8fc2ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="42" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="13.5" fill="#93a1b8">Building <tspan fill="#4f8fe8">•</tspan> Learning <tspan fill="#4f8fe8">•</tspan> Automating</text>
    </g>

    <!-- outer border -->
    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="13" fill="none" stroke="#1c2430" stroke-width="1.5"/>
  </g>
</svg>
