<svg width="560" height="360" viewBox="0 0 560 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay terminal whoami card">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <clipPath id="termFrame">
      <rect x="0" y="0" width="560" height="360" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termFrame)">
    <rect width="560" height="360" fill="url(#termBg)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="560" height="32" fill="#12161d"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="16" r="5" fill="#febc2e"/>
    <circle cx="56" cy="16" r="5" fill="#28c840"/>
    <text x="280" y="20" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#5c7a95">harsh@github: ~</text>
    <line x1="0" y1="32" x2="560" y2="32" stroke="#1c2330" stroke-width="1"/>

    <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14">
      <text x="20" y="60" fill="#7ec8ff">harsh@github<tspan fill="#5c7a95">:~$</tspan> whoami</text>

      <rect x="145" y="49" width="8" height="14" fill="#7ec8ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <text x="20" y="92" fill="#eef4fb" font-size="20" font-weight="700">Harsh Upadhyay</text>

      <line x1="20" y1="108" x2="540" y2="108" stroke="#1c2330" stroke-width="1"/>

      <text x="20" y="134" fill="#5c7a95">ROLE</text>
      <text x="140" y="134" fill="#dbe6f0">BCA Student</text>

      <text x="20" y="160" fill="#5c7a95">FOCUS</text>
      <text x="140" y="160" fill="#dbe6f0">Web Development</text>
      <text x="140" y="180" fill="#dbe6f0">Backend Architecture</text>
      <text x="140" y="200" fill="#dbe6f0">AI Automation</text>
      <text x="140" y="220" fill="#dbe6f0">System Design</text>

      <line x1="20" y1="236" x2="540" y2="236" stroke="#1c2330" stroke-width="1"/>

      <text x="20" y="262" fill="#5c7a95">STATUS</text>
      <text x="140" y="262" fill="#7ec8ff">Learning &amp; Building</text>

      <line x1="20" y1="278" x2="540" y2="278" stroke="#1c2330" stroke-width="1"/>

      <text x="20" y="304" fill="#5c7a95">PHILOSOPHY</text>
      <text x="20" y="326" fill="#9fb6cc" font-style="italic">"Build. Break. Understand. Improve."</text>

      <text x="20" y="348" fill="#3f5468">harsh@github<tspan fill="#2e4054">:~$</tspan> </text>
      <rect x="118" y="337" width="8" height="14" fill="#3f5468">
        <animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="1" y="1" width="558" height="358" rx="11" fill="none" stroke="#1c2330" stroke-width="1"/>
  </g>
</svg>
