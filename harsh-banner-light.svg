<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay — Developer (light mode)">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="0.55" stop-color="#eaf0f7"/>
      <stop offset="1" stop-color="#dde9f4"/>
    </linearGradient>
    <linearGradient id="windowGlowL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6fa5" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3a6fa5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="titleGlowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6fb0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f6fb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouetteGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8d8"/>
      <stop offset="1" stop-color="#8fa3b8"/>
    </linearGradient>
    <linearGradient id="deskGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d3e0"/>
      <stop offset="1" stop-color="#aebccd"/>
    </linearGradient>
    <filter id="softBlurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="frameL">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameL)">
    <rect width="1200" height="320" fill="url(#bgGradL)"/>

    <g opacity="0.9">
      <rect x="860" y="0" width="130" height="320" fill="url(#windowGlowL)"/>
      <rect x="1010" y="0" width="90" height="320" fill="url(#windowGlowL)" opacity="0.6"/>
    </g>

    <g fill="#2f6fb0">
      <circle cx="150" cy="60" r="1.4" opacity="0.35">
        <animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="90" r="1.2" opacity="0.3">
        <animate attributeName="cy" values="90;60;90" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="140" r="1.6" opacity="0.35">
        <animate attributeName="cy" values="140;110;140" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(830,215)" opacity="0.9">
      <rect x="0" y="30" width="330" height="6" rx="2" fill="url(#deskGradL)"/>
      <rect x="15" y="36" width="8" height="46" fill="#9aacc0"/>
      <rect x="300" y="36" width="8" height="46" fill="#9aacc0"/>
      <rect x="40" y="10" width="330" height="6" rx="2" fill="url(#deskGradL)" opacity="0.7"/>
    </g>

    <g transform="translate(945,120)">
      <ellipse cx="60" cy="150" rx="95" ry="14" fill="#8ea3b8" opacity="0.3" filter="url(#softBlurL)"/>
      <rect x="18" y="90" width="70" height="46" rx="3" fill="#dfe8f2" stroke="#9fb4c8" stroke-width="1.5"/>
      <rect x="24" y="96" width="58" height="34" rx="1" fill="#bcd6ea">
        <animate attributeName="fill" values="#bcd6ea;#a9c9e2;#bcd6ea" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <path d="M -20 150 C -20 90 20 60 60 60 C 100 60 140 90 140 150 Z" fill="url(#silhouetteGradL)"/>
      <circle cx="55" cy="42" r="26" fill="url(#silhouetteGradL)"/>
      <path d="M32 34 Q55 8 78 34 Q80 20 55 14 Q30 20 32 34 Z" fill="#6d829a"/>
    </g>

    <g transform="translate(70,0)">
      <circle cx="120" cy="130" r="150" fill="url(#titleGlowL)"/>
      <text x="0" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#101820" letter-spacing="2">
        HARSH UPADHYAY
      </text>
      <text x="2" y="172" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#3f6486">
        BCA STUDENT &#8226; DEVELOPER &#8226; AI &amp; AUTOMATION
      </text>

      <text x="2" y="220" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#5d7288">
        harsh@github ~ $ whoami
      </text>
      <rect x="215" y="209" width="8" height="15" fill="#2f6fb0">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <text x="2" y="252" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#3d5872" letter-spacing="0.5">
        Building &#8226; Learning &#8226; Automating
      </text>
    </g>

    <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#c3d2e0" stroke-width="1"/>
  </g>
</svg>
