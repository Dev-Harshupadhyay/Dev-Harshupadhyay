<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay — Developer, building for the web and for Chhath">
  <title>Harsh Upadhyay — Developer</title>

  <defs>
    <linearGradient id="skyL" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf8ef"/>
      <stop offset="0.5" stop-color="#f7eddd"/>
      <stop offset="1" stop-color="#efe2cb"/>
    </linearGradient>

    <radialGradient id="sunGlowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a544" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#f4a52a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f4a52a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunBodyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#e08a2b"/>
    </linearGradient>

    <linearGradient id="waterL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0e6"/>
      <stop offset="1" stop-color="#a9c3cc"/>
    </linearGradient>

    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf8ef" stop-opacity="0.97"/>
      <stop offset="0.52" stop-color="#fdf8ef" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fdf8ef" stop-opacity="0"/>
    </linearGradient>

    <pattern id="madhubaniL" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8a2318" stroke-opacity="0.13" stroke-width="1">
        <circle cx="24" cy="24" r="7"/>
        <path d="M24 12c3 4 3 20 0 24M24 12c-3 4-3 20 0 24M12 24c4-3 20-3 24 0M12 24c4 3 20 3 24 0"/>
      </g>
      <g fill="#8a2318" fill-opacity="0.14">
        <circle cx="0" cy="0" r="1.4"/><circle cx="48" cy="0" r="1.4"/>
        <circle cx="0" cy="48" r="1.4"/><circle cx="48" cy="48" r="1.4"/>
      </g>
    </pattern>

    <clipPath id="frameL"><rect width="1200" height="320" rx="16"/></clipPath>

    <style>
      .fl { font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      @keyframes breatheL { 0%,100% { opacity:.45; transform:scale(1); } 50% { opacity:.75; transform:scale(1.06); } }
      @keyframes flickerL { 0%,100% { opacity:.7; transform:translateY(0); } 50% { opacity:1; transform:translateY(-2.5px); } }
      @keyframes driftL   { 0% { transform:translateX(0);} 50% { transform:translateX(5px);} 100% { transform:translateX(0);} }
      .glowL  { animation: breatheL 6s ease-in-out infinite; transform-origin:940px 168px; }
      .diyaL  { animation: flickerL 3.4s ease-in-out infinite; }
      .diyaL2 { animation: flickerL 4.2s ease-in-out infinite; animation-delay:.7s; }
      .diyaL3 { animation: flickerL 2.9s ease-in-out infinite; animation-delay:1.4s; }
      .driftL { animation: driftL 9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .glowL,.diyaL,.diyaL2,.diyaL3,.driftL { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frameL)">
    <rect width="1200" height="320" fill="url(#skyL)"/>
    <rect width="1200" height="320" fill="url(#madhubaniL)"/>

    <!-- sun -->
    <g>
      <ellipse class="glowL" cx="940" cy="168" rx="185" ry="150" fill="url(#sunGlowL)"/>
      <circle cx="940" cy="168" r="46" fill="url(#sunBodyL)"/>
      <g stroke="#c9741f" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
        <path d="M940 104V92"/><path d="M940 244v-12"/>
        <path d="M876 168h-12"/><path d="M1016 168h12"/>
        <path d="M895 123l-9-9"/><path d="M985 213l9 9"/>
        <path d="M985 123l9-9"/><path d="M895 213l-9 9"/>
      </g>
    </g>

    <!-- river -->
    <path d="M0 250h1200v70H0z" fill="url(#waterL)"/>
    <g class="driftL" stroke="#5b6f78" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round">
      <path d="M820 268h52"/><path d="M900 282h74"/><path d="M1010 266h60"/>
      <path d="M860 296h46"/><path d="M960 304h58"/>
    </g>

    <!-- devotee silhouettes -->
    <g fill="#6b1b14" fill-opacity="0.82">
      <g transform="translate(872 250)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-13 -30l7-16M13 -30l-7-16"/>
      </g>
      <g transform="translate(1006 250) scale(1.08)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-13 -32l8-14M13 -32l-8-14"/>
      </g>
      <g transform="translate(1092 250) scale(0.9)">
        <circle cx="0" cy="-46" r="9"/>
        <path d="M-11 0c0-26 5-38 11-38s11 12 11 38z"/>
        <path d="M-12 -28l6-18M12 -28l-6-18"/>
      </g>
    </g>

    <!-- floating diyas -->
    <g>
      <g class="diyaL" transform="translate(790 286)">
        <path d="M0 0c-9 0-15-5-15-9h30c0 4-6 9-15 9z" fill="#e08a2b"/>
        <ellipse cx="0" cy="-12" rx="4.5" ry="7" fill="#fff3d6"/>
        <ellipse cx="0" cy="-12" rx="11" ry="16" fill="#e08a2b" fill-opacity="0.2"/>
      </g>
      <g class="diyaL2" transform="translate(1096 292)">
        <path d="M0 0c-8 0-13-4.5-13-8h26c0 3.5-5 8-13 8z" fill="#e08a2b"/>
        <ellipse cx="0" cy="-11" rx="4" ry="6" fill="#fff3d6"/>
        <ellipse cx="0" cy="-11" rx="10" ry="14" fill="#e08a2b" fill-opacity="0.2"/>
      </g>
      <g class="diyaL3" transform="translate(700 296)">
        <path d="M0 0c-7 0-12-4-12-7.5h24c0 3.5-5 7.5-12 7.5z" fill="#e08a2b"/>
        <ellipse cx="0" cy="-10" rx="3.5" ry="5.5" fill="#fff3d6"/>
        <ellipse cx="0" cy="-10" rx="9" ry="12" fill="#e08a2b" fill-opacity="0.2"/>
      </g>
    </g>

    <rect width="1200" height="320" fill="url(#fadeL)"/>

    <!-- ===== text ===== -->
    <g class="fl">
      <text x="64" y="86" fill="#a8851c" font-size="15" font-weight="700" letter-spacing="5.5">HELLO, I&apos;M</text>

      <text x="64" y="150" fill="#5e1710" font-size="60" font-weight="800" letter-spacing="-0.5">Harsh Upadhyay</text>

      <text x="64" y="188" fill="#3b2417" font-size="21" font-weight="600">BCA student &amp; web developer</text>
      <text x="64" y="216" fill="#54341f" font-size="17" font-weight="400" opacity="0.86">Building things for the web — and for Chhath.</text>

      <g>
        <rect x="64" y="240" width="118" height="30" rx="15" fill="#e08a2b" fill-opacity="0.16" stroke="#c9741f" stroke-opacity="0.6"/>
        <text x="123" y="260" fill="#8a2318" font-size="13" font-weight="700" text-anchor="middle">React</text>

        <rect x="192" y="240" width="96" height="30" rx="15" fill="#e08a2b" fill-opacity="0.16" stroke="#c9741f" stroke-opacity="0.6"/>
        <text x="240" y="260" fill="#8a2318" font-size="13" font-weight="700" text-anchor="middle">Vite</text>

        <rect x="298" y="240" width="118" height="30" rx="15" fill="#e08a2b" fill-opacity="0.16" stroke="#c9741f" stroke-opacity="0.6"/>
        <text x="357" y="260" fill="#8a2318" font-size="13" font-weight="700" text-anchor="middle">JavaScript</text>

        <rect x="426" y="240" width="104" height="30" rx="15" fill="#e08a2b" fill-opacity="0.16" stroke="#c9741f" stroke-opacity="0.6"/>
        <text x="478" y="260" fill="#8a2318" font-size="13" font-weight="700" text-anchor="middle">Python</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#8a2318" stroke-opacity="0.2"/>
</svg>
