<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay — BCA Student, Developer, AI and Automation (light mode)">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="55%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#e8edf4"/>
    </linearGradient>
    <linearGradient id="beamL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6fe0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dde4ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#cdd6e3" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="titleGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6fe0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fe0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2f6fe0" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2L" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frameL"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frameL)">
    <rect width="1200" height="320" fill="url(#bgL)"/>
    <polygon points="740,0 1040,0 1200,320 900,320" fill="url(#beamL)"/>

    <g stroke="#d7dee9" stroke-width="1" opacity="0.8">
      <line x1="820" y1="0" x2="820" y2="320"/>
      <line x1="920" y1="0" x2="920" y2="320"/>
      <line x1="1020" y1="0" x2="1020" y2="320"/>
      <line x1="1120" y1="0" x2="1120" y2="320"/>
      <line x1="760" y1="70" x2="1200" y2="70"/>
      <line x1="760" y1="150" x2="1200" y2="150"/>
    </g>

    <g fill="#eef2f7" stroke="#c9d2e0" stroke-width="1">
      <rect x="860" y="230" width="120" height="8" rx="2"/>
      <rect x="885" y="238" width="6" height="34"/>
      <rect x="945" y="238" width="6" height="34"/>
      <rect x="990" y="248" width="120" height="8" rx="2"/>
      <rect x="1015" y="256" width="6" height="34"/>
      <rect x="1075" y="256" width="6" height="34"/>
    </g>

    <rect x="0" y="230" width="1200" height="90" fill="url(#floorL)"/>

    <g fill="#2f6fe0">
      <circle cx="120" cy="60" r="1.6" opacity="0.35">
        <animate attributeName="cy" values="60;40;60" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="40" r="1.4" opacity="0.3">
        <animate attributeName="cy" values="40;60;40" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="100" r="1.8" opacity="0.35">
        <animate attributeName="cy" values="100;120;100" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(905,60)">
      <ellipse cx="70" cy="230" rx="70" ry="12" fill="#b9c3d4" opacity="0.5" filter="url(#softL)"/>
      <path d="M8 230 C 4 150, 10 90, 40 55 C 55 38, 78 30, 96 34 C 118 39, 130 60, 128 90 L 124 230 Z" fill="url(#rimL)" opacity="0.6"/>
      <path d="M6 230 C 2 148, 8 88, 38 54 C 54 36, 80 27, 100 32 C 124 38, 137 62, 133 92 L 128 230 Z" fill="#2a3242"/>
      <path d="M46 60 L 70 96 L 94 60" fill="none" stroke="#4a5878" stroke-width="2" opacity="0.7"/>
      <circle cx="70" cy="34" r="26" fill="#2a3242"/>
      <path d="M46 24 C 50 6 92 6 96 26 C 90 18 78 14 70 14 C 60 14 50 18 46 24 Z" fill="#1c2331"/>
      <circle cx="79" cy="34" r="1.4" fill="#2f6fe0" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.4;0.9" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="0" width="1200" height="2" fill="#2f6fe0" opacity="0.05">
      <animate attributeName="y" values="0;320;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <ellipse cx="360" cy="130" rx="360" ry="140" fill="url(#titleGlowL)" filter="url(#soft2L)"/>

    <text x="70" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="2" fill="#161b24">HARSH UPADHYAY</text>
    <text x="72" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#5b6577">BCA STUDENT • DEVELOPER • AI &amp; AUTOMATION</text>

    <g transform="translate(70,196)">
      <rect x="-14" y="-22" width="470" height="70" rx="10" fill="#ffffff" stroke="#d7dee9" stroke-width="1"/>
      <circle cx="2" cy="-6" r="4" fill="#c3cbda"/>
      <circle cx="18" cy="-6" r="4" fill="#c3cbda"/>
      <circle cx="34" cy="-6" r="4" fill="#c3cbda"/>
      <text x="0" y="18" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="15" fill="#2f6fe0">harsh@github <tspan fill="#8b95a8">~ $</tspan> whoami</text>
      <rect x="228" y="6" width="8" height="16" fill="#2f6fe0">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="42" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="13.5" fill="#465067">Building <tspan fill="#2f6fe0">•</tspan> Learning <tspan fill="#2f6fe0">•</tspan> Automating</text>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="13" fill="none" stroke="#d7dee9" stroke-width="1.5"/>
  </g>
</svg>
