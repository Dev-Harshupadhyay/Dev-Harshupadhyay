<svg width="820" height="180" viewBox="0 0 820 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay milestones">
  <defs>
    <linearGradient id="trbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="816" height="176" rx="14" fill="url(#trbg)" stroke="#1c2431" stroke-width="1.5"/>
  <text x="26" y="34" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#5b8def">MILESTONES</text>
  <line x1="26" y1="46" x2="794" y2="46" stroke="#1c2431" stroke-width="1"/>

  <!-- 4 milestone cards -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(26,64)">
      <rect width="176" height="96" rx="10" fill="#0f131c" stroke="#202836" stroke-width="1"/>
      <circle cx="30" cy="30" r="14" fill="none" stroke="#4f8fe8" stroke-width="2"/>
      <path d="M23 30 l5 5 l10 -11" fill="none" stroke="#4f8fe8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="62" font-size="12.5" fill="#e6ebf2">Account Active</text>
      <text x="18" y="80" font-size="10.5" fill="#7c8aa0">Since account creation</text>
    </g>
    <g transform="translate(220,64)">
      <rect width="176" height="96" rx="10" fill="#0f131c" stroke="#202836" stroke-width="1"/>
      <text x="18" y="42" font-size="26" font-weight="700" fill="#eef2f7">23</text>
      <text x="18" y="62" font-size="12.5" fill="#e6ebf2">Repositories</text>
      <text x="18" y="80" font-size="10.5" fill="#7c8aa0">Public projects &amp; experiments</text>
    </g>
    <g transform="translate(414,64)">
      <rect width="176" height="96" rx="10" fill="#0f131c" stroke="#202836" stroke-width="1"/>
      <text x="18" y="42" font-size="26" font-weight="700" fill="#eef2f7">1</text>
      <text x="18" y="62" font-size="12.5" fill="#e6ebf2">Star Earned</text>
      <text x="18" y="80" font-size="10.5" fill="#7c8aa0">First mark of recognition</text>
    </g>
    <g transform="translate(608,64)">
      <rect width="186" height="96" rx="10" fill="#0f131c" stroke="#202836" stroke-width="1"/>
      <g transform="translate(18,16)">
        <circle cx="12" cy="12" r="10" fill="#4f8fe8">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="18" y="62" font-size="12.5" fill="#e6ebf2">Still Building</text>
      <text x="18" y="80" font-size="10.5" fill="#7c8aa0">Every day, one commit further</text>
    </g>
  </g>
</svg>
