name: Update profile art

# Refreshes harsh-heatmap.svg, harsh-stats.svg and harsh-languages.svg from
# public GitHub data. No personal access token is required — the built-in
# GITHUB_TOKEN (scoped to this repo only) is enough for public read calls.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Refresh stats + language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats_and_languages.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harsh-heatmap.svg harsh-stats.svg harsh-languages.svg contributions.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: refresh profile art [automated]"
          git push
