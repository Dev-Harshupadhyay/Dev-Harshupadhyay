<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay most used languages">
  <defs>
    <linearGradient id="langbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f5fb0"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="476" height="216" rx="14" fill="url(#langbg)" stroke="#1c2431" stroke-width="1.5"/>

  <text x="26" y="36" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="12" letter-spacing="3" fill="#5b8def">MOST USED LANGUAGES</text>
  <line x1="26" y1="48" x2="454" y2="48" stroke="#1c2431" stroke-width="1"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c7d1e0">
    <!-- HTML -->
    <text x="26" y="72">HTML</text>
    <rect x="120" y="61" width="308" height="12" rx="6" fill="#161c27"/>
    <rect x="120" y="61" width="230" height="12" rx="6" fill="url(#barfill)">
      <animate attributeName="width" values="0;230" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="440" y="72" text-anchor="end" fill="#7c8aa0" font-size="11">~46%</text>

    <!-- JavaScript -->
    <text x="26" y="102">JavaScript</text>
    <rect x="120" y="91" width="308" height="12" rx="6" fill="#161c27"/>
    <rect x="120" y="91" width="140" height="12" rx="6" fill="url(#barfill)">
      <animate attributeName="width" values="0;140" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="440" y="102" text-anchor="end" fill="#7c8aa0" font-size="11">~28%</text>

    <!-- Python -->
    <text x="26" y="132">Python</text>
    <rect x="120" y="121" width="308" height="12" rx="6" fill="#161c27"/>
    <rect x="120" y="121" width="90" height="12" rx="6" fill="url(#barfill)">
      <animate attributeName="width" values="0;90" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="440" y="132" text-anchor="end" fill="#7c8aa0" font-size="11">~18%</text>

    <!-- CSS -->
    <text x="26" y="162">CSS</text>
    <rect x="120" y="151" width="308" height="12" rx="6" fill="#161c27"/>
    <rect x="120" y="151" width="40" height="12" rx="6" fill="url(#barfill)">
      <animate attributeName="width" values="0;40" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="440" y="162" text-anchor="end" fill="#7c8aa0" font-size="11">~8%</text>
  </g>

  <line x1="26" y1="180" x2="454" y2="180" stroke="#1c2431" stroke-width="1"/>
  <text x="26" y="200" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="9.5" fill="#3a4452">approximate — recalculated by scripts/fetch_languages.py</text>
</svg>
