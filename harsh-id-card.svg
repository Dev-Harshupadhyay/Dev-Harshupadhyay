<svg width="420" height="260" viewBox="0 0 420 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harsh Upadhyay developer ID card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="420" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1016"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7ec8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5a7a"/>
      <stop offset="1" stop-color="#1c2b3a"/>
    </linearGradient>
    <clipPath id="cardFrame">
      <rect x="0" y="0" width="420" height="260" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardFrame)">
    <rect width="420" height="260" fill="url(#cardBg)"/>
    <rect width="420" height="130" fill="url(#cardGlass)"/>

    <!-- scan line -->
    <rect x="0" y="0" width="420" height="2" fill="#7ec8ff" opacity="0.12">
      <animate attributeName="y" values="0;260;0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- header strip -->
    <text x="24" y="30" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#5c7a95">ELITE DEV ACADEMY</text>
    <text x="396" y="30" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#5c7a95">CLASS-01</text>
    <line x1="24" y1="40" x2="396" y2="40" stroke="#22303f" stroke-width="1"/>

    <!-- silhouette portrait, calm anime-inspired student -->
    <g transform="translate(30,55)">
      <rect x="0" y="0" width="88" height="88" rx="10" fill="#0a0d13" stroke="#2a3a4d" stroke-width="1"/>
      <path d="M6 82 C6 55 22 40 44 40 C66 40 82 55 82 82 Z" fill="#182231"/>
      <circle cx="44" cy="34" r="20" fill="#182231"/>
      <path d="M24 27 Q44 5 64 27 Q66 15 44 10 Q22 15 24 27 Z" fill="#080a0d"/>
      <path d="M30 44 Q44 50 58 44" stroke="#4a7ba8" stroke-width="1" opacity="0.5" fill="none"/>
    </g>

    <!-- info -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#eef4fb">
      <text x="140" y="80" font-size="20" font-weight="700" letter-spacing="1">HARSH UPADHYAY</text>
      <text x="140" y="102" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7ea6c9">BCA STUDENT</text>
      <text x="140" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7ea6c9">DEVELOPER</text>
    </g>

    <line x1="24" y1="152" x2="396" y2="152" stroke="#22303f" stroke-width="1"/>

    <!-- chip + status -->
    <rect x="24" y="168" width="34" height="24" rx="4" fill="url(#chipGrad)" stroke="#3a5a7a" stroke-width="1"/>
    <text x="70" y="180" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#5c7a95">GITHUB</text>
    <text x="70" y="194" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#eef4fb">Dev-Harshupadhyay</text>

    <text x="24" y="222" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="1.5" fill="#5c7a95">STATUS</text>
    <text x="90" y="222" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#7ec8ff">
      LEARNING / BUILDING
      <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- decorative QR-style block -->
    <g transform="translate(330,168)" fill="#7ea6c9" opacity="0.85">
      <rect x="0" y="0" width="6" height="6"/><rect x="10" y="0" width="6" height="6"/><rect x="24" y="0" width="6" height="6"/>
      <rect x="0" y="10" width="6" height="6"/><rect x="18" y="10" width="6" height="6"/>
      <rect x="6" y="18" width="6" height="6"/><rect x="24" y="18" width="6" height="6"/>
      <rect x="0" y="26" width="6" height="6"/><rect x="12" y="26" width="6" height="6"/><rect x="24" y="26" width="6" height="6"/>
    </g>
    <text x="330" y="215" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="9" letter-spacing="1" fill="#3f5468">ID-7734-HU</text>

    <rect x="1" y="1" width="418" height="258" rx="17" fill="none" stroke="#26364a" stroke-width="1"/>
  </g>
</svg>
